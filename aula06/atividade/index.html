<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style/global.css">
  <title>Steam</title>
</head>
<body>

  <header class="header">
    <div class="first-area">
      <a href="https://store.steampowered.com/?l=portuguese" target="_blank" rel="noopener noreferrer"><img src="assets/icons/steamlogo.svg" alt="simbolo da steam"></a>
      <p>View</p>
      <p>Friends</p>
      <p>Games</p>
      <p>Help</p>
    </div>
    
    <div class="second-area">
      <h2>STORE</h2>
      <h2>LIBRARY</h2>
      <h2>COMMUNITY</h2>
      <h2>NAME</h2>
    </div>
  </header>
  
  <aside class="aside">
    <div class="container">
      <button>Home</button>
      <label for="category_id"></label>
      <select name="tipo" id="category_id">
        <option value="games and software">Games and Software</option>
        <option value="games">Games</option>
        <option value="software">Software</option>
        <option value="soundtracks">Soundtracks</option>
        <option value="tools">Tools</option>
      </select>
    </div>

    <div class="search">
      <label for="search">
        <img src="assets/icons/lupa.svg" alt="imagem de uma lupa">
      </label>
      <input id="search" type="search" placeholder="Search by Name">
    </div>

    <div class="games">
      <a href="#">
        <button>
          <img src="assets/images/logocp.png" alt="Logo do jogo cyberpunk 2077">
          <p>Cyberpunk 2077</p>
        </button>
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="img">
      <img src="assets/images/backgroundcp.jpg" alt="">
    </div>

    <div class="information">
      <button>
        <p>PLAY</p>
      </button>

      <div>
        <h2>CLOUD STATUS</h2>
        <p>Up to date</p>
      </div>

      <div>
        <h2>LAST PLAYED</h2>
        <p>yesterday</p>
      </div>

      <div>
        <h2>PLAY TIME</h2>
        <p>1000 hours</p>
      </div>

      <div>
        <h2>ACHIEVEMENTS</h2>
        <p>67/67</p>
      </div>
    </div>
    
    <div class="information-below">
      <a href="#">
        <button>Store Page</button>
      </a>

      <a href="#">
        <button>DLC</button>
      </a>

      <a href="#">
        <button>Community Hub</button>
      </a>

      <a href="#">
        <button>Discussions</button>
      </a>

      <a href="#">
        <button>Guides</button>
      </a>

      <a href="#">
        <button>Support</button>
      </a>
    </div>

    <div class="label">
      <label for="activity_id">ACTIVITY</label>
      <input type="search" name="activity" id="activity_id" placeholder="Talk about this game."> 
    </div>
  </main>

  <footer class="">
    <p>
      Obrigado por visitar o meu trabalho
    </p>
  </footer>

</body>
</html>
